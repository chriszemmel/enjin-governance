name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/**"]
  # Advisories are published when other people publish them, not when we
  # commit, so the audit also runs on a clock: Monday morning, UTC.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Version is inferred from packageManager in package.json - keeping
        # both here and there leads to ERR_PNPM_BAD_PM_VERSION.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Knip
        run: pnpm knip

      - name: Audit dependencies
        run: pnpm audit --prod

      - name: Test
        # Fails on no tests found and on coverage below the floors in
        # vitest.config.ts (lib/governance, lib/auth).
        run: pnpm test:coverage --reporter=default --reporter=json --outputFile.json=vitest-results.json

      - name: Test badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node .github/scripts/test-badge.mjs vitest-results.json tests.json

      - name: Upload test badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: test-badge
          path: tests.json
          retention-days: 1

      - name: Build
        run: pnpm build
        env:
          # WC project ID is optional at build time since the hotfix; the
          # APP_URL just needs to be a valid URL.
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"

  badge:
    name: Publish test badge
    # Only the count from a green run on main reaches the README. This job
    # runs no project code and is the only one that may push: it writes the
    # badge JSON to the `badges` branch, which holds nothing else.
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download test badge
        uses: actions/download-artifact@v4
        with:
          name: test-badge

      - name: Push to the badges branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir publish && mv tests.json publish/ && cd publish
          git init -q -b badges
          git add tests.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898315+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Test badge for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build
        env:
          # The tests run the production server on this origin.
          NEXT_PUBLIC_APP_URL: "http://localhost:3100"

      - name: Run browser tests
        # API, storage and wallet are faked in the browser; chain data comes
        # from the public Canary RPC (see e2e/support/).
        run: pnpm test:e2e
        env:
          E2E_SKIP_BUILD: "1"

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
